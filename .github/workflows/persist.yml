name: Persist live scores
on:
  schedule:
    - cron: '*/10 * 16-19 10 *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch valid results
        run: |
          curl -fLsS --retry 4 --retry-delay 10 --max-time 90 https://tcf-kucukler-2026.onrender.com/api/standings -o /tmp/standings.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/standings.json'))
          assert len(a.get('standings',[]))>=10 and a.get('updated'), 'No valid live snapshot'
          print('Stored',len(a['standings']),'clubs at',a['updated'])
          PY
      - name: Commit to separate scores branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin scores; then
            git fetch origin scores:scores
            git switch scores
          else
            git switch --orphan scores
            git rm -rf . || true
          fi
          cp /tmp/standings.json standings.json
          git add standings.json
          if ! git diff --cached --quiet; then
            git commit -m "Save live championship results"
            git push origin scores
          fi
