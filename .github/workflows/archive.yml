name: Archive final standings
on:
  schedule:
    - cron: '40 20 19 10 *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '40 20 19 10 *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture final scoreboard
        run: |
          curl --fail --retry 5 --retry-delay 10 --max-time 90 -sS https://gymexa-club-live.onrender.com/api/standings -o public/final.json
          python3 - <<'PY'
          import json
          with open('public/final.json') as f: data=json.load(f)
          if not data.get('standings') or len(data['standings'])<2: raise SystemExit('No valid scoreboard')
          print('Archived clubs:',len(data['standings']))
          PY
      - name: Commit archived scoreboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/final.json
          git diff --cached --quiet || (git commit -m "Archive competition scoreboard" && git push)
